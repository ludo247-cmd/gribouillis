<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Gribouillis Élèves</title>
<meta name="theme-color" content="#e11d2e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Grib. Élèves">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-eleve-32.png">
<link rel="icon" type="image/svg+xml" href="icon-eleve.svg">
<link rel="apple-touch-icon" href="apple-touch-icon-eleve.png">
<link rel="manifest" href="eleve.webmanifest">
<style>
:root{--bg:#0b0c0f;--card:#15171c;--card2:#1a1d24;--line:#2d323d;--tx:#e8e8ea;--dim:#a3a7b0;--ok:#15803d;--blue:#1d4ed8;--violet:#6d28d9;--red:#dc2626;--cc:#475569;}
*{box-sizing:border-box;}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent;}
body{min-height:100vh;}
button{font-family:inherit;cursor:pointer;}
#app{max-width:760px;margin:0 auto;padding:12px 14px 40px;display:flex;flex-direction:column;gap:12px;}
.top{display:flex;align-items:center;gap:8px;}
.top h1{flex:1;font-size:1.05rem;margin:0;line-height:1.25;}
.top small{display:block;color:var(--dim);font-weight:400;font-size:.78rem;}
.sync{font-size:.72rem;color:var(--dim);border:1px solid var(--line);border-radius:999px;padding:4px 9px;white-space:nowrap;background:none;}
.sync.bad{color:#fecaca;border-color:#b91c1c;}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px;}
.card.club{border:2px solid var(--cc);}
.card h2{font-size:1rem;margin:0;display:flex;align-items:center;gap:8px;}
.card h2 span{flex:1;}
.dim{color:var(--dim);font-size:.85rem;}
.clubs{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;}
.clubbtn{min-height:90px;border:none;border-radius:16px;color:#fff;font-size:1.5rem;font-weight:900;}
.big{min-height:54px;border:none;border-radius:12px;background:var(--violet);color:#fff;font-weight:800;font-size:1rem;padding:0 14px;}
.big.blue{background:var(--blue);}.big.green{background:var(--ok);}.big.grey{background:#334155;}.big.ghost{background:transparent;border:1px solid var(--line);color:var(--dim);font-weight:600;}
.row{display:flex;gap:8px;flex-wrap:wrap;}.row>*{flex:1;}
.item{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:6px;}
.item b{font-size:1rem;}.item .who{font-size:.82rem;color:var(--dim);}
.pj{font-size:.88rem;color:#c4b5fd;}
.tag{display:inline-block;font-size:.72rem;border-radius:999px;padding:2px 8px;background:#262a33;color:#cbd5e1;margin-right:4px;}
.tag.play{background:#1e3a8a;color:#dbeafe;}.tag.ref{background:#713f12;color:#fef3c7;}.tag.train{background:#3b0764;color:#ede9fe;}.tag.ok{background:#14532d;color:#dcfce7;}
.now{border-color:#0e7490;background:#06202a;}
.small{font-size:.75rem;padding:4px 10px;min-height:34px;border-radius:9px;border:1px solid var(--line);background:none;color:var(--dim);}
.opt{display:flex;flex-direction:column;gap:3px;text-align:left;width:100%;min-height:52px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--card2);color:var(--tx);font-size:.95rem;}
.opt span{font-size:.82rem;color:#c3c6cc;}.opt em{font-size:.72rem;color:#a5b4fc;font-style:normal;}
.opt.on{border-color:var(--red);background:#2a1416;}
.lab{font-size:.75rem;text-transform:uppercase;letter-spacing:.04em;color:var(--dim);margin-top:4px;}
.rk{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:12px;background:var(--card2);border:1px solid var(--line);}
.rk.top{border-color:var(--red);background:#2a1416;}.rk .n{font-weight:900;color:#fca5a5;width:22px;font-size:1.1rem;}.rk .t{flex:1;font-size:.92rem;}
.rk button{width:42px;height:38px;border:0;border-radius:8px;background:#262a33;color:#fff;font-size:1rem;}
.steps{display:flex;gap:4px;}.steps i{flex:1;height:5px;border-radius:3px;background:#262a33;}.steps i.on{background:var(--red);}
.cp{display:flex;gap:8px;align-items:flex-start;background:#13202f;border:1px solid #1e3a5f;border-radius:10px;padding:8px 10px;font-size:.9rem;}
.cp span{flex:0 0 22px;height:22px;border-radius:50%;background:var(--blue);color:#fff;font-weight:800;font-size:.75rem;display:flex;align-items:center;justify-content:center;}
.ctr{display:flex;align-items:center;justify-content:center;gap:16px;}
.ctr button{width:72px;height:72px;border-radius:16px;border:none;background:#334155;color:#fff;font-size:2rem;}
.ctr .v{font-size:3.2rem;font-weight:900;min-width:110px;text-align:center;}
.ov{position:fixed;inset:0;background:var(--bg);z-index:50;overflow-y:auto;}
.ov>.in{max-width:760px;margin:0 auto;padding:12px 14px 40px;display:flex;flex-direction:column;gap:12px;}
.names{display:flex;flex-wrap:wrap;gap:8px;}.names button{min-height:52px;padding:0 16px;border-radius:12px;border:1px solid var(--line);background:var(--card2);color:var(--tx);font-weight:700;font-size:1rem;}
.names button.on{background:var(--violet);border-color:#a78bfa;}.names button.tk{opacity:.5;}
/* match */
.score{display:flex;align-items:stretch;gap:10px;}
.score>div{flex:1;border-radius:14px;padding:8px;text-align:center;background:var(--card2);border:2px solid var(--line);}
.score b{display:block;font-size:.95rem;}.score .pts{font-size:3.4rem;font-weight:900;line-height:1.1;}
.score .us{border-color:var(--cc);}
.mbtns{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.mb{min-height:84px;border:none;border-radius:14px;color:#fff;font-weight:800;font-size:1.05rem;position:relative;padding:6px;}
.mb small{display:block;font-weight:600;opacity:.85;font-size:.75rem;}
.mb .c{position:absolute;top:6px;right:9px;font-size:.8rem;opacity:.9;}
.fr{min-height:60px;border:none;border-radius:12px;background:var(--violet);color:#fff;font-weight:700;position:relative;padding:6px 40px 6px 10px;text-align:left;}
.fr .c{position:absolute;right:12px;top:50%;transform:translateY(-50%);font-size:1.1rem;font-weight:900;}
.banner{background:#14532d;border:1px solid #22c55e;border-radius:12px;padding:10px;display:flex;gap:8px;align-items:center;}
.banner span{flex:1;font-weight:700;}
.step{border:1px solid var(--line);border-radius:12px;background:var(--card2);overflow:hidden;}.step.now{border-color:#0e7490;}.step.open{border-color:var(--cc);}
.step .sh{display:flex;align-items:center;gap:10px;width:100%;min-height:58px;padding:8px 12px;background:none;border:none;color:var(--tx);text-align:left;}
.step .sn{flex:0 0 28px;height:28px;border-radius:50%;background:#262a33;display:flex;align-items:center;justify-content:center;font-weight:800;}.step.now .sn{background:#0e7490;}
.step .st{flex:1;display:flex;flex-direction:column;gap:2px;}.step .st small{color:var(--dim);font-size:.8rem;}.step .sc{color:var(--dim);}
.step .sb{padding:4px 12px 12px;display:flex;flex-direction:column;gap:8px;}
.cp.f3{border-color:#dc2626;background:#2a1416;font-weight:800;}
.err{background:#3f1212;border:1px solid #b91c1c;border-radius:12px;padding:12px;}
.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:#111827;border:1px solid #334155;color:#fff;padding:10px 14px;border-radius:12px;z-index:99;font-size:.9rem;max-width:92vw;}
.vbox .side{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;border:2px solid var(--line);border-radius:14px;padding:10px;}
.vbox .side .v{font-size:2.8rem;font-weight:900;}
.vbox .side .pm{display:flex;gap:10px;}.vbox .side .pm button{width:56px;height:56px;border:none;border-radius:12px;background:#334155;color:#fff;font-size:1.6rem;}
a.vid{color:#93c5fd;}
.vid2{width:100%;max-height:60vh;border-radius:12px;background:#000;}
.vbox2{position:relative;width:100%;padding-top:56.25%;border-radius:12px;overflow:hidden;background:#000;}.vbox2 iframe{position:absolute;inset:0;width:100%;height:100%;border:0;}
.sync.wait{color:#fff;background:#0e7490;border-color:#0e7490;font-weight:700;}
</style>
</head>
<body>
<div id="app"><div class="card"><b>Chargement de la séance…</b></div></div>
<script>
'use strict';
// ══════════════════════════════════════════════════════════════════════
// Gribouillis — app élève (tablettes). La séance est publiée par le prof
// dans le Google Sheets de la séquence ; cette page la lit et n'écrit que
// des « retours » (projets, scores validés par les capitaines, observations).
// ══════════════════════════════════════════════════════════════════════
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LS={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v);}catch(e){return d;}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}},
  sget(k){try{return sessionStorage.getItem(k);}catch(e){return null;}},sset(k,v){try{if(v==null)sessionStorage.removeItem(k);else sessionStorage.setItem(k,v);}catch(e){}}};
function toast(t){const d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2600);}
// ── configuration (lien / QR) ──
function parseConf(t){const i=String(t||'').indexOf('#');if(i<0)return null;const h=new URLSearchParams(String(t).slice(i+1));const c={p:h.get('p'),f:h.get('f'),k:h.get('k'),s:h.get('s')||'last'};return (c.p&&c.f&&c.k)?c:null;}
function confId(c){return c.f+'|'+c.k;}
function rememberConf(c){LS.set('el_conf',c);const L=LS.get('el_confs',{});L[confId(c)]=Object.assign({},L[confId(c)]||{},{c:c,at:Date.now()});LS.set('el_confs',L);}
function readConf(){const c=parseConf(location.href);if(c){rememberConf(c);return c;}return LS.get('el_conf',null);}
let CONF=readConf();
function useConf(id){const L=LS.get('el_confs',{});const x=L[id];if(!x)return;LS.set('el_conf',x.c);location.hash='';location.reload();}
function pasteConf(){const t=($('cfin')||{}).value||'';const c=parseConf(t);if(!c){toast('Ce n\'est pas un lien de séance Gribouillis');return;}rememberConf(c);CONF=c;ST.pk=null;load(true);}
let TAB=LS.get('el_tab',null);if(!TAB){TAB='tab-'+Math.random().toString(36).slice(2,8);LS.set('el_tab',TAB);}
const ST={pk:null,ret:[],online:null,err:'',view:'home',busy:false};
function SID(){return (ST.pk&&ST.pk.sid)||(CONF&&CONF.s);}
function cacheKey(){return 'el_cache_'+confId(CONF);}
function locKey(){return 'el_loc_'+SID();}
function LOC(){const l=LS.get(locKey(),null)||{};l.projets=l.projets||{};l.queue=l.queue||[];l.scores=l.scores||{};return l;}
function saveLoc(l){LS.set(locKey(),l);}
// ── réseau ──
async function apiGet(){const u=CONF.p+(CONF.p.indexOf('?')<0?'?':'&')+'action=eleve&fichier='+encodeURIComponent(CONF.f)+'&k='+encodeURIComponent(CONF.k)+'&s='+encodeURIComponent(CONF.s||'last')+'&t='+Date.now();
  const r=await fetch(u,{redirect:'follow'});const j=JSON.parse(await r.text());if(j.erreur)throw new Error(j.erreur==='cle'?'lien périmé : demande le nouveau QR code au prof':j.erreur==='seance'?'séance pas encore publiée par le prof':j.erreur);return j;}
async function apiPut(items,sid){const r=await fetch(CONF.p,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},redirect:'follow',body:JSON.stringify({action:'eleve_put',fichier:CONF.f,k:CONF.k,s:sid,tab:TAB,items:items})});
  const j=JSON.parse(await r.text());if(j.erreur)throw new Error(j.erreur);return j;}
async function load(first){try{const j=await apiGet();ST.pk=j.paquet;ST.ret=j.retours||[];ST.online=true;ST.err='';LS.set(cacheKey(),{pk:ST.pk,ret:ST.ret});const L=LS.get('el_confs',{});if(L[confId(CONF)]){L[confId(CONF)].titre=ST.pk.titre;LS.set('el_confs',L);}}
  catch(e){ST.online=false;ST.err=e.message;if(first){const c=LS.get(cacheKey(),null);if(c){ST.pk=c.pk;ST.ret=c.ret||[];}}}
  if(first||ST.view==='home')render();else renderSync();}
function QK(){return 'el_queue_'+confId(CONF);}
function queue(){return LS.get(QK(),[]);}
function send(items){let Q=queue();const sid=SID();items.forEach(it=>{it.s=sid;Q=Q.filter(q=>!(q.s===sid&&q.type===it.type&&q.ref===it.ref));Q.push(it);});LS.set(QK(),Q);renderSync();flush();}
async function flush(manual){const Q=queue();if(!Q.length||ST.busy){if(manual&&!Q.length)toast('☁️ Tout est déjà envoyé');return;}ST.busy=true;renderSync();let sent=0;
  try{const by={};Q.forEach(q=>{(by[q.s]=by[q.s]||[]).push(q);});
    for(const sid of Object.keys(by)){const items=by[sid].slice(0,150);const j=await apiPut(items,sid);sent+=items.length;LS.set(QK(),queue().filter(q=>!items.some(x=>x.s===q.s&&x.type===q.type&&x.ref===q.ref&&x.t===q.t)));if(sid===SID())ST.ret=j.retours||ST.ret;}
    ST.online=true;ST.err='';if(manual)toast('☁️ '+sent+' résultat'+(sent>1?'s':'')+' envoyé'+(sent>1?'s':''));}
  catch(e){ST.online=false;ST.err=e.message;if(manual)toast('⚠️ Pas d\'internet : les résultats restent gardés sur la tablette');}finally{ST.busy=false;renderSync();}}
window.addEventListener('online',()=>{if(CONF)flush();});
setInterval(()=>{if(document.visibilityState!=='visible'||!CONF)return;flush();if(ST.view==='home')load(false);},25000);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&CONF){flush();if(ST.view==='home')load(false);}});
// ── données dérivées ──
const PK=()=>ST.pk||{};
function club(){return LS.sget('el_club_'+SID());}
function setClub(id){LS.sset('el_club_'+SID(),id);render();}
function clubOf(id){return (PK().clubs||[]).find(c=>c.id===id)||{id:id,nom:'?',col:'#475569'};}
function abs(){return PK().abs||[];}
function membersOf(cid,fi){const E=PK().eleves||{};const F=fi==null?null:((PK().formes||[])[fi]||{}).ids;
  return Object.keys(E).filter(n=>E[n].club===cid&&abs().indexOf(n)<0&&(!F||F.indexOf(E[n].cat)>=0)).sort((a,b)=>a.localeCompare(b,'fr'));}
function formLab(fi){const f=(PK().formes||[])[fi];return f?f.lab:'';}
function projAll(){const P={};const put=(k,v)=>{if(!v||typeof v!=='object')return;if(!P[k]||(+v.t||0)>=(+P[k].t||0))P[k]=v;};
  Object.keys(PK().projets||{}).forEach(k=>put(k,PK().projets[k]));ST.ret.filter(r=>r.type==='projet').forEach(r=>put(r.ref,r.data));const l=LOC();Object.keys(l.projets).forEach(k=>put(k,l.projets[k]));return P;}
function colKey(cid){return clubOf(cid).nom+' · projet collectif';}
function binsOf(cid){const P=projAll();return Object.keys(P).filter(k=>P[k]&&P[k].club===cid&&P[k].kind==='bin').sort((a,b)=>(P[a].t0||0)-(P[b].t0||0));}
function oeById(id){return (PK().oes||[]).find(o=>o.id===id)||null;}
function microOf(p){const o=oeById(p&&p.oe);return o&&(o.micro||[]).find(m=>m.id===p.frm)||null;}
function exoOf(p){if(!p||!p.exoId)return null;if(String(p.exoId).indexOf('lib:')===0){const x=(PK().lib||[]).find(z=>'lib:'+z.id===p.exoId);return x?{titre:x.titre,desc:x.desc,video:x.video,crit:[]}:null;}
  for(const o of PK().oes||[])for(const m of o.micro||[])for(const c of m.cps||[])if(c.path===p.cpPath){const x=(c.ex||[]).find(e=>e.id===p.exoId);if(x)return x;}
  for(const o of PK().oes||[])for(const m of o.micro||[])for(const c of m.cps||[]){const x=(c.ex||[]).find(e=>e.id===p.exoId);if(x)return x;}return null;}
function pjStatus(p){if(!p||!p.ind)return (p&&p.hist&&p.hist.length?'<i class="dim">nouveau projet à faire (ancien : '+esc(p.hist[p.hist.length-1].ind||'')+')</i>':'<i class="dim">pas encore de projet</i>');const x=exoOf(p);return '🎯 '+esc(p.ind)+(x?' · '+esc(x.titre)+(p.scoreAt?' · <b>'+p.score+'/10</b>':''):' · exercice à choisir');}
function scoreOf(ref){const l=LOC();const mine=l.scores[ref];const ok=ST.ret.filter(r=>r.type==='score'&&r.ref===ref&&r.data&&r.data.ok);
  if(mine&&mine.ok)return mine;if(ok.length)return ok[ok.length-1].data;const m=(PK().matchs||[]).find(x=>x.ref===ref);if(m&&m.sa!==''&&m.sa!=null)return {sa:m.sa,sb:m.sb,ok:true,prof:true};return null;}
function hm(t){const m=/(\d{1,2})h(\d{2})/.exec(t||'');return m?(+m[1])*60+(+m[2]):null;}
function curBloc(){const B=PK().blocs||[];const d=new Date();const n=d.getHours()*60+d.getMinutes();return B.find(b=>{const a=hm(b.start),e=hm(b.end);return a!=null&&e!=null&&n>=a&&n<e;})||null;}
function matchByRef(ref){return (PK().matchs||[]).find(m=>m.ref===ref)||null;}
function refClubOf(m){if(m&&m.arb)return m.arb;const o=(PK().clubs||[]).filter(c=>c.id!==m.a&&c.id!==m.b);return o.length?o[0].id:null;}
function roleIn(m,cid,fi){if(!m)return 'train';if(m.niv===fi&&(m.a===cid||m.b===cid))return 'play';if(m.niv===fi&&refClubOf(m)===cid)return 'ref';return 'train';}
// ── rendu ──
function renderSync(){const b=$('sync');if(!b)return;const q=CONF?queue().length:0;b.className='sync'+(ST.online===false?' bad':'')+(q?' wait':'');
  b.textContent=ST.busy?'⏳ envoi…':(q?'📤 Envoyer ('+q+')':(ST.online===false?'⚠️ hors ligne':'☁️ à jour'));b.title=(q?q+' résultat(s) gardé(s) sur la tablette. ':'')+(ST.err||'');}
function topHtml(){const c=club()?clubOf(club()):null;return '<div class="top"><h1>'+esc(PK().titre||'Séance')+(c?'<small>Club <b style="color:'+esc(c.col)+'">'+esc(c.nom)+'</b></small>':'')+'</h1><button class="sync" id="sync" onclick="flush(true);load(false)"></button></div>';}
function render(){ST.view='home';const app=$('app');
  if(!CONF){app.innerHTML='<div class="top"><h1>Gribouillis Élèves</h1></div><div class="card"><h2><span>📲 Ouvrir la séance</span></h2><div class="dim">Scanne le QR code de ton prof avec l\'appareil photo, ou colle ici le lien qu\'il t\'a envoyé :</div><textarea id="cfin" rows="3" style="width:100%;border-radius:10px;background:#0f1115;color:#fff;border:1px solid var(--line);padding:8px;font-size:.9rem"></textarea><button class="big green" onclick="pasteConf()">Ouvrir</button></div>';return;}
  if(!ST.pk){app.innerHTML='<div class="err"><b>Séance introuvable.</b><br>'+esc(ST.err||'')+'<br><br><button class="big grey" onclick="load(true)">Réessayer</button></div>';return;}
  const cid=club();
  if(!cid||!(PK().clubs||[]).some(c=>c.id===cid)){app.innerHTML=topHtml()+'<div class="card"><h2><span>🏳 Quel est votre club ?</span></h2><div class="clubs">'+(PK().clubs||[]).map(c=>'<button class="clubbtn" style="background:'+esc(c.col)+'" onclick="setClub(\''+esc(c.id)+'\')">'+esc(c.nom)+'</button>').join('')+'</div>'
      +((PK().clubs||[]).length?'':'<div class="dim">Aucun club dans cette séance : le prof doit d\'abord créer les clubs (championnat ou colonne Club de la liste).</div>')+'</div>';renderSync();return;}
  const c=clubOf(cid);document.documentElement.style.setProperty('--cc',c.col);
  const BL=PK().blocs||[];const cur=curBloc();if(OPEN.k===undefined)OPEN.k=cur?cur.key:(BL[0]&&BL[0].key);
  let h=topHtml();
  // une seule frise : chaque étape de la séance, avec ce que fait le club (et ses projets)
  h+='<div class="card"><h2><span>📋 Notre séance</span>'+(cur?'<span class="tag ok" style="flex:0 0 auto">⏱ maintenant : '+esc(cur.lab)+'</span>':'')+'</h2>';
  BL.forEach((bl,i)=>{const on=OPEN.k===bl.key;const isNow=cur&&cur.key===bl.key;
    h+='<div class="step'+(on?' open':'')+(isNow?' now':'')+'"><button class="sh" onclick="stepTog(\''+esc(bl.key)+'\')"><span class="sn">'+(i+1)+'</span><span class="st"><b>'+esc(bl.lab)+'</b><small>'+esc(bl.start||'')+(bl.end?'–'+esc(bl.end):'')+' · '+stepSum(bl,cid)+'</small></span><span class="sc">'+(on?'▲':'▼')+'</span></button>'
      +(on?'<div class="sb">'+stepBody(bl,cid)+'</div>':'')+'</div>';});
  if(!BL.length)h+='<div class="dim">Le déroulé de la séance n\'a pas été publié.</div>';
  h+='</div>';
  // projets (création / modification)

  let h='<div class="top"><h1>⚽ '+esc(c.nom)+(MT.niv!=null?' '+esc(formLab(MT.niv)):'')+' contre '+esc(o.nom)+'<small>Match en '+tg+' points · '+esc(MT.lineup.join(', '))+'</small></h1><button class="small" onclick="mQuit()">✕</button></div>';
  h+='<div class="score"><div class="us"><b>Nous · '+esc(c.nom)+'</b><div class="pts">'+MT.us+'</div></div><div><b>Eux · '+esc(o.nom)+'</b><div class="pts">'+MT.them+'</div></div></div>';
  if(end)h+='<div class="banner"><span>🏁 '+tg+' points : fin du match !</span><button class="big green" onclick="vOpen()">Valider le score</button></div>';
  h+='<div class="mbtns"><button class="mb" style="background:#16a34a" onclick="mHit(\'bp\',true)">🌟 Beau point<small>pour nous · qui ?</small><span class="c">'+mCount('bp')+'</span></button>'
    +'<button class="mb" style="background:#7c3aed" onclick="mHit(\'ap\',false)">🎁 Autre point<small>pour nous</small><span class="c">'+mCount('ap')+'</span></button>'
    +'<button class="mb" style="background:#dc2626" onclick="mHit(\'bpa\',false)">Beau point<small>pour eux</small><span class="c">'+mCount('bpa')+'</span></button>'
    +'<button class="mb" style="background:#ea580c" onclick="mHit(\'apa\',true)">Autre point pour eux<small>notre faute · qui ?</small><span class="c">'+mCount('apa')+'</span></button></div>';
  const fr=mBtns();if(fr.length)h+='<div class="lab">Nos fils rouges (sans changer le score)</div>'+fr.map((f,i)=>'<button class="fr" onclick="mFr('+i+')">'+esc(f.label)+'<span class="c">'+mCount('fr',f.k)+'</span></button>').join('');
  h+='<div class="row"><button class="big grey" onclick="mUndo()"'+(MT.log.length?'':' disabled')+'>↩ Annuler le dernier</button><button class="big green" onclick="vOpen()">🏁 Fin du match</button></div>';
  ovShow(h);}
function mHit(type,who){if(who&&MT.lineup.length){mWho(type);return;}mAdd({type:type});}
function mAdd(e){e.t=Date.now();MT.log.push(e);if(e.type==='bp'||e.type==='ap')MT.us++;if(e.type==='bpa'||e.type==='apa')MT.them++;try{if(navigator.vibrate)navigator.vibrate(30);}catch(x){}mRender();}
function mWho(type){ovShow('<div class="top"><h1>'+(type==='bp'?'🌟 Qui a marqué ce beau point ?':'Qui a fait la faute ?')+'</h1><button class="small" onclick="mRender()">✕</button></div><div class="names">'+MT.lineup.map(n=>'<button data-n="'+esc(n)+'" onclick="mAdd({type:\''+type+'\',n:this.dataset.n})">'+esc(n)+'</button>').join('')+'<button onclick="mAdd({type:\''+type+'\'})">On ne sait pas</button></div>');}
function mFr(i){const f=mBtns()[i];if(!f)return;MT.log.push({type:'fr',k:f.k,lab:f.label,t:Date.now()});mRender();}
function mUndo(){const e=MT.log.pop();if(!e)return;if(e.type==='bp'||e.type==='ap')MT.us--;if(e.type==='bpa'||e.type==='apa')MT.them--;mRender();}
function mQuit(){if(MT.log.length&&!confirm('Quitter le match ? Il reste en mémoire : vous pourrez le reprendre avec « Observer ce match ».'))return;ovClose();}
// ── validation par les deux capitaines ──
let VS=null;
function vOpen(){const a=MT.mineA?MT.us:MT.them,b=MT.mineA?MT.them:MT.us;VS={sa:a,sb:b};vRender();}
function vRender(){const m=matchByRef(MT.ref);const A=clubOf(m?m.a:MT.club),B=clubOf(m?m.b:MT.opp);
  const side=(k,cl)=>'<div class="side" style="border-color:'+esc(cl.col)+'"><b>'+esc(cl.nom)+'</b><div class="v">'+VS[k]+'</div><div class="pm"><button onclick="vAdj(\''+k+'\',-1)">−</button><button onclick="vAdj(\''+k+'\',1)">+</button></div></div>';
  ovShow('<div class="top"><h1>🏆 Score du match'+(MT.niv!=null?' · '+esc(formLab(MT.niv)):'')+'</h1></div><div class="card vbox"><div class="row" style="align-items:center">'+side('sa',A)+'<b style="flex:0;font-size:2rem">–</b>'+side('sb',B)+'</div>'
    +'<div style="text-align:center"><b>Les deux capitaines sont-ils d\'accord avec ce score ?</b><div class="dim">Corrigez avec − / + si besoin, puis validez.</div></div>'
    +'<button class="big green" onclick="vOk(true)">✅ Nous sommes d\'accord : on valide</button><button class="big ghost" onclick="vOk(false)">Pas d\'accord : le prof décidera</button><button class="big ghost" onclick="mRender()">↩ Revenir au match</button></div>');}
function vAdj(k,d){VS[k]=Math.max(0,VS[k]+d);vRender();}
function vOk(ok){const c=clubOf(MT.club);const pl={};MT.log.forEach(e=>{if(!e.n)return;pl[e.n]=pl[e.n]||{bp:0,apa:0};pl[e.n][e.type]=(pl[e.n][e.type]||0)+1;});
  const fr={};MT.log.filter(e=>e.type==='fr').forEach(e=>{fr[e.lab]=(fr[e.lab]||0)+1;});
  const obs={club:MT.club,opp:MT.opp,niv:MT.niv,us:MT.us,them:MT.them,bp:mCount('bp'),ap:mCount('ap'),bpa:mCount('bpa'),apa:mCount('apa'),joueurs:pl,filsRouges:fr,lineup:MT.lineup,debut:MT.t0,fin:Date.now()};
  const sc={sa:VS.sa,sb:VS.sb,ok:!!ok,club:MT.club};const l=LOC();l.scores[MT.ref]=sc;saveLoc(l);
  send([{type:'score',ref:MT.ref,club:c.nom,data:sc,t:Date.now()},{type:'obs',ref:MT.ref,club:c.nom,data:obs,t:Date.now()}]);
  try{localStorage.removeItem(mKey());}catch(e){}const lineup=MT.lineup.slice(),cl=MT.club;MT=null;toast(ok?'🏆 Score validé et envoyé':'Score envoyé au prof (non validé)');
  if(!afterMatch(cl,lineup,fr))ovClose();}
function afterMatch(cid,lineup,fr){const P=projAll();const keys=[colKey(cid)].concat(binsOf(cid).filter(k=>(P[k].members||[]).some(n=>lineup.indexOf(n)>=0)));const L=keys.filter(k=>P[k]&&P[k].ind);if(!L.length)return false;ST.view='after';
  ovShow('<div class="top"><h1>🎯 Et maintenant, notre projet ?<small>Après ce match, on garde notre fil rouge ou on en change ?</small></h1></div>'+L.map(k=>{const p=P[k];const kk=esc(k).replace(/'/g,"\\'");const n=fr['🎯 '+p.ind]||fr['👥 '+p.ind]||0;const x=exoOf(p);
    return '<div class="card"><b>'+esc(k.replace(/^.*? · /,''))+'</b><div class="pj">🎯 '+esc(p.ind)+(x?' · '+esc(x.titre)+(p.scoreAt?' · '+p.score+'/10':''):'')+'</div><div class="dim">Pendant le match, ce fil rouge a été noté '+n+' fois.</div>'
      +'<div class="row"><button class="big" onclick="pjKeep(\''+kk+'\')">💪 Consolider ce projet</button><button class="big blue" onclick="pjNew(\''+kk+'\')">🆕 Nouveau projet</button></div></div>';}).join('')
    +'<button class="big ghost" onclick="ovClose()">Plus tard</button>');return true;}
function pjKeep(k){pjOpen(k,3);}
function pjNew(k){const P=projAll();const p=P[k]||{};const hist=(p.hist||[]).concat([{oe:p.oe,frm:p.frm,frmLab:p.frmLab,ind:p.ind,exoId:p.exoId,cpPath:p.cpPath,score:p.score,scoreAt:p.scoreAt,fin:Date.now()}]).slice(-10);
  const np={club:p.club||club(),kind:p.kind||'col',t0:Date.now(),t:Date.now(),hist:hist};if(p.members)np.members=p.members.slice();pjPut(k,np);toast('🆕 Nouveau projet : choisissez votre objectif');pjOpen(k,1);}
// ── démarrage ──
try{if('serviceWorker' in navigator&&/^https?:/.test(location.protocol))navigator.serviceWorker.register('sw-eleve.js',{scope:'./eleve.html'}).catch(()=>{});}catch(e){}
if(CONF){const c=LS.get(cacheKey(),null);if(c){ST.pk=c.pk;ST.ret=c.ret||[];render();}load(true).then(()=>{flush();const sv=LS.get(mKey(),null);if(sv&&sv.club===club()&&sv.log&&sv.log.length){MT=sv;mRender();}});}else render();
</script>
</body>
</html>
